name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'
      - 'vite.config.ts'
      - 'index.html'
      - 'docs/android.md'
      - 'scripts/write-app-update.mjs'

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  apk:
    # 避免 bot 回写 app-update.json 再次触发本 workflow
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 便于回写 app-update.json 时 push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 勿安装已下架的旧包名 `tools`（setup-android 默认会装，导致失败）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install npm deps
        run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_BASE: './'

      - name: Install Capacitor
        run: |
          npm install -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6

      - name: Add & sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage named APK
        id: stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p out
          SRC=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          test -n "$SRC" && test -s "$SRC"
          DEST="out/stock-workstation-${VERSION}-debug.apk"
          cp "$SRC" "$DEST"
          ls -la "$DEST"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_path=${DEST}" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$DEST")" >> "$GITHUB_OUTPUT"

      # Actions artifact 下载得到的永远是「整包 zip」，需解压才有 .apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-workstation-debug-apk
          path: ${{ steps.stage.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # soft release：浏览器可直接下 .apk（无需登录解压 artifact zip）
      - name: Publish soft Release (direct APK)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=android-debug-latest
          VERSION="${{ steps.stage.outputs.version }}"
          APK="${{ steps.stage.outputs.apk_path }}"
          NOTES=$(cat <<MD
          ## Android debug APK（自用测试）

          - 版本：v${VERSION}
          - 签名：**debug**（非正式上架包）
          - 提交：\`${GITHUB_SHA}\`
          - Actions：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 更新元数据：https://timeroulette.github.io/stock-workstation/app-update.json

          ### 安装步骤（必读）

          1. 点下方 Assets 里的 **\`stock-workstation-${VERSION}-debug.apk\`** 下载（扩展名必须是 \`.apk\`，不是 \`.zip\`）。
          2. 手机：设置 → 允许「未知来源 / 安装未知应用」（浏览器或文件管理器）。
          3. 用文件管理器打开刚下的 \`.apk\` → 安装。
          4. 若系统拦截「有害应用警告」，选「仍要安装 / 更多详情」（debug 签名常见）。
          5. **同 debug 签名可覆盖安装**；从带「检查更新」的版本起，可在设置里应用内检查并可选更新。

          ### 注意

          - **不要**把 GitHub Actions Artifacts 页面下到的 zip 直接当 APK 打开；那是压缩包，需先解压。
          - 本 soft tag \`android-debug-latest\` 每次构建会覆盖，便于固定链接下载。
          - 已经装出去的旧包（如 0.11.0）若当时没有检查器，需**手动装一次**带检查器的新包，之后才可应用内更新。
          - 日常更推荐 PWA：https://timeroulette.github.io/stock-workstation/
          MD
          )
          # 覆盖同名 soft release / tag（不存在则忽略）
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          # 等一下避免 tag 删除后立刻重建偶发冲突
          sleep 2
          gh release create "$TAG" "$APK" \
            --title "Android Debug APK (v${VERSION})" \
            --notes "$NOTES" \
            --latest=false
          echo "Release URL: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"

      - name: Refresh app-update.json and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.stage.outputs.version }}"
          APK_NAME="${{ steps.stage.outputs.apk_name }}"
          APK_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/android-debug-latest/${APK_NAME}"
          # changelog：本提交标题 + 最近若干条
          CHANGELOG_LINES=$(git log -8 --pretty=format:'%s')
          VERSION="$VERSION" \
            APK_URL="$APK_URL" \
            PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            CHANGELOG_LINES="$CHANGELOG_LINES" \
            node scripts/write-app-update.mjs

          if git diff --quiet -- public/app-update.json; then
            echo "app-update.json unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-update.json
          git commit -m "chore(android): refresh app-update.json for v${VERSION} [skip android]"
          # Pages 会因 main 推送而部署；本 job 对 github-actions[bot] 已跳过，避免循环
          git push origin HEAD:main
